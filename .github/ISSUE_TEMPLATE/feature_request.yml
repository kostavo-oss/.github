name: Feature request
description: Something the tool should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, more than the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: What you would like the tool to do, and how you would expect to use it.
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: The workaround, if there is one.
