name: python-ci

# The gate every Kostavo Python tool shares: ruff, and the tests on every
# supported Python. A tool calls it from its own ci.yml:
#
#   jobs:
#     python:
#       uses: kostavo-oss/.github/.github/workflows/python-ci.yml@main
#
# It expects what the template gives a tool: a uv project with ruff and pytest
# in the `dev` group.

on:
  workflow_call:
    inputs:
      python-versions:
        description: The Pythons to run the tests on, as a JSON list.
        type: string
        default: '["3.11", "3.12", "3.13"]'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Tests (pytest)
        run: uv run --python ${{ matrix.python-version }} pytest
