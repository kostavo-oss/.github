name: python-release

# What a release needs before it can be published: the tag and pyproject.toml
# naming the same version, the gate passing on that commit, and a wheel and
# sdist that install. They are left as the artifact `dist`.
#
# Publishing is the caller's, not this workflow's. PyPI's Trusted Publisher is
# a repository and a workflow file in it, and a reusable workflow can't be one:
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
# So a tool's release.yml calls this, then publishes what it built:
#
#   on:
#     push:
#       tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
#
#   jobs:
#     build:
#       uses: kostavo-oss/.github/.github/workflows/python-release.yml@main
#     publish:
#       needs: build
#       runs-on: ubuntu-latest
#       environment: pypi
#       permissions:
#         id-token: write
#       steps:
#         - uses: actions/download-artifact@v8
#           with: { name: dist, path: dist }
#         - uses: pypa/gh-action-pypi-publish@release/v1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: gate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag and pyproject.toml name the same version
        # First, because everything after it is wasted on a tag that is wrong.
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::pyproject.toml says $version, so the release is the tag v$version — this ran on '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "releasing $version"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Build
        run: uv build
      - name: Smoke-test the built wheel on 3.11
        # The tests ran against the checkout. This is the file people install:
        # every command it declares has to start.
        run: |
          uv venv /tmp/smoke -p 3.11
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          commands=$(uv run python -c "import tomllib; print(*tomllib.load(open('pyproject.toml', 'rb'))['project'].get('scripts', {}))")
          for command in $commands; do
            echo "$command --help"
            "/tmp/smoke/bin/$command" --help > /dev/null
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
